<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="ambient-blue" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-emerald" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="light-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.65"/>
    </pattern>

    <!-- Soft Card Shadow -->
    <filter id="card-shadow" x="-8%" y="-10%" width="116%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.02"/>
    </filter>

    <!-- Inner Pill Style -->
    <filter id="pill-shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .title-main { font-weight: 800; font-size: 40px; fill: #0F172A; letter-spacing: -0.025em; }
    .title-sub { font-weight: 500; font-size: 16px; fill: #475569; letter-spacing: -0.01em; }
    .pill-text { font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
    .card-tag { font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
    .card-title { font-weight: 700; font-size: 17px; fill: #0F172A; letter-spacing: -0.015em; }
    .card-desc { font-weight: 400; font-size: 12px; fill: #64748B; line-height: 1.45; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-gradient)"/>
  <rect width="1200" height="420" fill="url(#ambient-blue)"/>
  <rect width="1200" height="420" fill="url(#ambient-emerald)"/>
  <rect width="1200" height="420" fill="url(#light-grid)"/>

  <!-- Top Badges / Status Pills -->
  <g transform="translate(60, 42)">
    <!-- Badge 1: Antigravity Native -->
    <g filter="url(#pill-shadow)">
      <rect x="0" y="0" width="200" height="34" rx="17" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4.5" fill="#2563EB"/>
      <text x="110" y="21.5" text-anchor="middle" class="font-base pill-text" fill="#1E40AF">Antigravity 2.0 Native</text>
    </g>

    <!-- Badge 2: Jetpack Compose & Roborazzi -->
    <g transform="translate(215, 0)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="245" height="34" rx="17" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4.5" fill="#059669"/>
      <text x="132" y="21.5" text-anchor="middle" class="font-base pill-text" fill="#065F46">Jetpack Compose &amp; Roborazzi</text>
    </g>

    <!-- Badge 3: Deterministic Governance -->
    <g transform="translate(475, 0)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="215" height="34" rx="17" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4.5" fill="#7C3AED"/>
      <text x="118" y="21.5" text-anchor="middle" class="font-base pill-text" fill="#5B21B6">Zero Rogue Commits</text>
    </g>
  </g>

  <!-- Title & Strategic Proposition -->
  <g transform="translate(60, 132)">
    <text x="0" y="0" class="font-base title-main">
      Agentic Android Delivery Kernel
      <tspan fill="#64748B" font-weight="400"> — Micro-Kernel Protocol</tspan>
    </text>
    <text x="0" y="32" class="font-base title-sub">
      Deterministic Multi-Agent Governance, Just-In-Time Issue Sealing &amp; Automated Quality Airbag
    </text>
  </g>

  <!-- Bottom Feature Cards -->
  <g transform="translate(60, 222)">
    <!-- Card 1: 6 Personas & PoLP -->
    <g filter="url(#card-shadow)">
      <rect x="0" y="0" width="252" height="142" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="22" y="36" class="font-base card-tag" fill="#2563EB">Principle of Least Privilege</text>
      <text x="22" y="66" class="font-base card-title">6 Personas &amp; PoLP</text>
      <text x="22" y="93" class="font-base card-desc">Dedicated engineering roles,</text>
      <text x="22" y="111" class="font-base card-desc">shell revoked for P1–P4</text>
    </g>

    <!-- Card 2: 2 Blocking Gates -->
    <g transform="translate(276, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="252" height="142" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="22" y="36" class="font-base card-tag" fill="#059669">Human-In-The-Loop</text>
      <text x="22" y="66" class="font-base card-title">2 Blocking Gates</text>
      <text x="22" y="93" class="font-base card-desc">Gate 1.4 Inception Halt &amp;</text>
      <text x="22" y="111" class="font-base card-desc">Gate 3.5 Auto-Merge Lock</text>
    </g>

    <!-- Card 3: JIT Sealing & Rule 0.1 -->
    <g transform="translate(552, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="252" height="142" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="22" y="36" class="font-base card-tag" fill="#7C3AED">Traceability &amp; Epics</text>
      <text x="22" y="66" class="font-base card-title">JIT Sealing &amp; Rule 0.1</text>
      <text x="22" y="93" class="font-base card-desc">seal-issue.sh + Projects v2,</text>
      <text x="22" y="111" class="font-base card-desc">isolated epic/** branching</text>
    </g>

    <!-- Card 4: Quality Airbag -->
    <g transform="translate(828, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="252" height="142" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="22" y="36" class="font-base card-tag" fill="#D97706">Comprehensive Verification</text>
      <text x="22" y="66" class="font-base card-title">Quality Airbag</text>
      <text x="22" y="93" class="font-base card-desc">codeSanityCheck, Roborazzi</text>
      <text x="22" y="111" class="font-base card-desc">&amp; 38 doc contracts verified</text>
    </g>
  </g>
</svg>
