<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="ambient-blue" cx="88%" cy="14%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-violet" cx="12%" cy="86%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-emerald" cx="50%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>

    <filter id="pill-shadow" x="-6%" y="-12%" width="112%" height="132%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="logo-shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.22"/>
    </filter>

    <!-- Logo Mark Gradient -->
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Card Icon Box Gradients -->
    <linearGradient id="icon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="icon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="icon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="icon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .title-main { font-weight: 800; font-size: 46px; fill: #0F172A; letter-spacing: -0.03em; }
    .title-main-sub { font-weight: 400; font-size: 46px; fill: #64748B; letter-spacing: -0.02em; }
    .title-sub { font-weight: 500; font-size: 19px; fill: #475569; letter-spacing: -0.015em; }
    .pill-text { font-weight: 600; font-size: 13px; letter-spacing: 0.01em; }
    .card-tag { font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .card-title { font-weight: 700; font-size: 19px; fill: #0F172A; letter-spacing: -0.015em; }
    .card-desc { font-weight: 400; font-size: 13px; fill: #64748B; line-height: 1.45; }
    .footer-text { font-weight: 500; font-size: 13px; fill: #94A3B8; letter-spacing: 0.02em; }
  </style>

  <!-- Background Base Canvas (1280x640) -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>
  <rect width="1280" height="640" fill="url(#ambient-blue)"/>
  <rect width="1280" height="640" fill="url(#ambient-violet)"/>
  <rect width="1280" height="640" fill="url(#ambient-emerald)"/>
  <rect width="1280" height="640" fill="url(#light-grid)"/>

  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ================= TOP BADGES ROW (Y: 52) ================= -->
  <g transform="translate(60, 52)">
    <!-- Badge 1: Antigravity 2.0 Native -->
    <g filter="url(#pill-shadow)">
      <rect x="0" y="0" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#2563EB"/>
      <text x="115" y="22.5" text-anchor="middle" class="font-base pill-text" fill="#1E40AF">Antigravity 2.0 Native</text>
    </g>

    <!-- Badge 2: Jetpack Compose & Roborazzi -->
    <g transform="translate(226, 0)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="245" height="36" rx="18" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#059669"/>
      <text x="132" y="22.5" text-anchor="middle" class="font-base pill-text" fill="#065F46">Jetpack Compose &amp; Roborazzi</text>
    </g>

    <!-- Badge 3: 6 Personas & PoLP -->
    <g transform="translate(487, 0)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#7C3AED"/>
      <text x="110" y="22.5" text-anchor="middle" class="font-base pill-text" fill="#5B21B6">6 Personas &amp; PoLP</text>
    </g>

    <!-- Badge 4: Zero Rogue Commits -->
    <g transform="translate(703, 0)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#D97706"/>
      <text x="108" y="22.5" text-anchor="middle" class="font-base pill-text" fill="#92400E">Zero Rogue Commits</text>
    </g>
  </g>

  <!-- ================= HERO HEADER & BRANDING (Y: 135 to 275) ================= -->
  <g transform="translate(60, 138)">
    <!-- App Emblem / Icon -->
    <g filter="url(#logo-shadow)">
      <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#logo-gradient)"/>
      <!-- Android Head Silhouette & Kernel Nodes -->
      <path d="M 24 45 C 24 33 30 25 38 25 C 46 25 52 33 52 45 Z" fill="#FFFFFF"/>
      <line x1="28" y1="23" x2="23" y2="16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="23" x2="53" y2="16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="32" cy="36" r="2.2" fill="#2563EB"/>
      <circle cx="44" cy="36" r="2.2" fill="#2563EB"/>
      <!-- Kernel Circuit Base -->
      <circle cx="24" cy="56" r="2.5" fill="#6EE7B7"/>
      <circle cx="38" cy="58" r="3" fill="#FFFFFF"/>
      <circle cx="52" cy="56" r="2.5" fill="#93C5FD"/>
      <line x1="26.5" y1="56" x2="35" y2="58" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="41" y1="58" x2="49.5" y2="56" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
    </g>

    <!-- Main Title & Subtitle (aligned with icon) -->
    <g transform="translate(98, 0)">
      <text x="0" y="40" class="font-base title-main">
        Agentic Android Delivery Kernel
        <tspan class="title-main-sub"> — Micro-Kernel</tspan>
      </text>
      <text x="0" y="72" class="font-base title-sub">
        Deterministic Multi-Agent Governance, Just-In-Time Issue Sealing &amp; Automated Quality Airbag
      </text>
    </g>

    <!-- Value Proposition Metric Pills Row -->
    <g transform="translate(98, 108)">
      <text x="0" y="0" class="font-base" font-size="13.5" font-weight="600" fill="#64748B">
        <tspan fill="#2563EB">⚡ &lt; 10 KB Micro-Kernel</tspan>
        <tspan fill="#CBD5E1"> &nbsp;•&nbsp; </tspan>
        <tspan fill="#059669">🔒 PoLP Shell Revocation</tspan>
        <tspan fill="#CBD5E1"> &nbsp;•&nbsp; </tspan>
        <tspan fill="#7C3AED">🛡️ 2 Human-in-the-Loop Gates</tspan>
        <tspan fill="#CBD5E1"> &nbsp;•&nbsp; </tspan>
        <tspan fill="#D97706">🧪 Roborazzi Screenshot Testing</tspan>
        <tspan fill="#CBD5E1"> &nbsp;•&nbsp; </tspan>
        <tspan fill="#475569">📋 GitHub Projects v2</tspan>
      </text>
    </g>
  </g>

  <!-- ================= 4 BOTTOM FEATURE CARDS (Y: 330, Height: 215) ================= -->
  <!-- Usable width: 1160px. 4 cards: 272px width, 24px gap -> 272*4 + 24*3 = 1160px -->
  <g transform="translate(60, 330)">
    
    <!-- CARD 1: 6 Personas & PoLP -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="272" height="215" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Icon Container -->
      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#icon-blue)"/>
      <path d="M 42 29 L 51 33 L 51 42 C 51 47 47 51 42 53 C 37 51 33 47 33 42 L 33 33 Z" fill="none" stroke="#2563EB" stroke-width="2"/>
      <circle cx="42" cy="40" r="2.5" fill="#2563EB"/>
      <!-- Tags and Titles -->
      <text x="74" y="38" class="font-base card-tag" fill="#2563EB">Least Privilege</text>
      <text x="74" y="55" class="font-base" font-size="12" font-weight="600" fill="#94A3B8">PoLP Runtime Shield</text>
      
      <text x="22" y="94" class="font-base card-title">6 Personas &amp; PoLP</text>
      
      <text x="22" y="124" class="font-base card-desc">Dedicated engineering personas:</text>
      <text x="22" y="145" class="font-base card-desc">Planner, Designer, Privacy, Architect.</text>
      <text x="22" y="166" class="font-base card-desc">Shell strictly revoked for P1–P4.</text>

      <!-- Bottom Accent Line -->
      <rect x="22" y="196" width="40" height="3" rx="1.5" fill="#2563EB"/>
    </g>

    <!-- CARD 2: 2 Blocking Gates -->
    <g transform="translate(296, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="272" height="215" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Icon Container -->
      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#icon-emerald)"/>
      <circle cx="42" cy="42" r="11" fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M 38 42 L 41 45 L 47 39" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Tags and Titles -->
      <text x="74" y="38" class="font-base card-tag" fill="#059669">Human-In-The-Loop</text>
      <text x="74" y="55" class="font-base" font-size="12" font-weight="600" fill="#94A3B8">Deterministic Halts</text>
      
      <text x="22" y="94" class="font-base card-title">2 Blocking Gates</text>
      
      <text x="22" y="124" class="font-base card-desc">Gate 1.4 Inception Halt halts</text>
      <text x="22" y="145" class="font-base card-desc">before coding. Gate 3.5 locks auto-</text>
      <text x="22" y="166" class="font-base card-desc">merge until human confirmation.</text>

      <!-- Bottom Accent Line -->
      <rect x="22" y="196" width="40" height="3" rx="1.5" fill="#059669"/>
    </g>

    <!-- CARD 3: JIT Sealing & Rule 0.1 -->
    <g transform="translate(592, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="272" height="215" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Icon Container -->
      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#icon-purple)"/>
      <path d="M 34 34 L 50 34 L 50 50 L 34 50 Z" fill="none" stroke="#7C3AED" stroke-width="2" rx="2"/>
      <line x1="38" y1="40" x2="46" y2="40" stroke="#7C3AED" stroke-width="1.5"/>
      <line x1="38" y1="44" x2="43" y2="44" stroke="#7C3AED" stroke-width="1.5"/>
      <!-- Tags and Titles -->
      <text x="74" y="38" class="font-base card-tag" fill="#7C3AED">Traceability &amp; Epics</text>
      <text x="74" y="55" class="font-base" font-size="12" font-weight="600" fill="#94A3B8">Native Projects v2</text>
      
      <text x="22" y="94" class="font-base card-title">JIT Sealing &amp; Rule 0.1</text>
      
      <text x="22" y="124" class="font-base card-desc">seal-issue.sh seals GitHub issues</text>
      <text x="22" y="145" class="font-base card-desc">with Priority, Size &amp; Estimate.</text>
      <text x="22" y="166" class="font-base card-desc">Isolated epic/** branch lifecycle.</text>

      <!-- Bottom Accent Line -->
      <rect x="22" y="196" width="40" height="3" rx="1.5" fill="#7C3AED"/>
    </g>

    <!-- CARD 4: Quality Airbag & Tests -->
    <g transform="translate(888, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="272" height="215" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Icon Container -->
      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#icon-amber)"/>
      <path d="M 44 29 L 36 41 L 42 41 L 40 53 L 49 40 L 43 40 Z" fill="#D97706"/>
      <!-- Tags and Titles -->
      <text x="74" y="38" class="font-base card-tag" fill="#D97706">Zero-Tolerance</text>
      <text x="74" y="55" class="font-base" font-size="12" font-weight="600" fill="#94A3B8">Full Automation</text>
      
      <text x="22" y="94" class="font-base card-title">Quality Airbag</text>
      
      <text x="22" y="124" class="font-base card-desc">Automated codeSanityCheck,</text>
      <text x="22" y="145" class="font-base card-desc">Roborazzi UI snapshot testing,</text>
      <text x="22" y="166" class="font-base card-desc">and 38 doc contracts verified.</text>

      <!-- Bottom Accent Line -->
      <rect x="22" y="196" width="40" height="3" rx="1.5" fill="#D97706"/>
    </g>
  </g>

  <!-- ================= SUBTLE BOTTOM BRANDING / SAFE FOOTER (Y: 595) ================= -->
  <g transform="translate(60, 595)">
    <text x="0" y="0" class="font-base footer-text">
      github.com/nicolasvd/agentic-android-delivery-kernel
    </text>
    <text x="1160" y="0" text-anchor="end" class="font-base footer-text">
      Engineered for Google Antigravity &amp; Android Jetpack Compose
    </text>
  </g>
</svg>
