name: 💡 Feature Proposal
description: Propose a new feature or improvement for Agentic Android Kernel
title: "feat(<scope>): <short descriptive title>"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧠 Feature Proposal for Agentic Android Kernel
        Thank you for contributing to the Agentic Android Delivery Kernel! Please fill out this form to propose a new feature adhering to the Spec-Driven (4 Pillars) framework.
  - type: dropdown
    id: scope
    attributes:
      label: Scope / Functional Domain
      description: Choose the primary domain affected by this feature.
      options:
        - core (Local Room database, data repositories, clean architecture)
        - ui (Jetpack Compose components, themes, animations, Roborazzi)
        - ai (Gemini multimodal logic, smart agents, function calling)
        - sync (Firestore synchronization, offline-first reconciliation)
        - analytics (Zero-PII telemetry, adoption metrics, audit trails)
        - tooling (Operational scripts, CI/CD automation, hooks)
        - governance (Rules, personas, multi-agent protocol, templates)
    validations:
      required: true
  - type: textarea
    id: problem-context
    attributes:
      label: Context & Problem Statement
      description: What is the real problem or friction experienced? Why is this feature needed?
      placeholder: "Example: Offline users currently experience delay when syncing items..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & User Experience (UX)
      description: Describe precisely the desired solution, user interactions, and expected outcome.
      placeholder: "Example: Introduce an exponential backoff retry mechanism with local Room queue..."
    validations:
      required: true
  - type: textarea
    id: impact-analytics
    attributes:
      label: Desired Impact Metrics & Telemetry
      description: Which telemetry events (event_name, parameters) or usage metrics will measure adoption and success?
      placeholder: "Example:\n- event_name: 'feature_activated' (params: feature_id, source)\n- event_name: 'sync_completed' (params: latency_ms, items_count)"
    validations:
      required: false
  - type: textarea
    id: technical-architecture
    attributes:
      label: Technical Architecture & Implementation Notes (Optional)
      description: Anticipated implementation details (Room Schema, StateFlow, ViewModel, Jetpack Compose, Gemini, Firestore).
      placeholder: "Example: Add 'priority' field to Entity, update KernelRepository..."
    validations:
      required: false
  - type: checkboxes
    id: quality-commitments
    attributes:
      label: Quality Commitments & Guidelines
      description: Mandatory validation criteria for future implementation.
      options:
        - label: Adherence to MVI / Clean Kotlin architecture (ViewModel, StateFlow, Room / Firestore)
          required: true
        - label: 100% Jetpack Compose UI compliant with Serene UI principles (gentle animations, zero friction)
          required: true
        - label: Formalized Analytics & Observability contract (Zero-PII)
          required: true
        - label: Unit tests & Robolectric (100% passing on './scripts/quality-check.sh')
          required: true
