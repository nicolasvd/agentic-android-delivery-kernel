name: 💡 Feature Proposal
description: Propose a new feature or improvement for Agentic Android Kernel
title: "feat(<scope>): <short descriptive title>"
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧠 Feature Proposal for Agentic Android Kernel
        Thank you for contributing to mental load reduction! Please fill out this form to structure your feature following the Spec-Driven (4 Pillars) framework.
  - type: dropdown
    id: scope
    attributes:
      label: Scope / Functional Domain
      description: Choose the primary domain affected by this feature.
      options:
        - tasks (Mental load management, recurrence, cycles)
        - matrix (Eisenhower matrix, 4-quadrant prioritization)
        - duo (Couple mode, task rotation, shared synchronization)
        - analytics (Trend charts, mental balance, gauges)
        - core (Local Room database, Firestore synchronization, Auth)
        - ai (Gemini automated classification, smart suggestions)
        - ui (Visual components, serene animations, Theme)
    validations:
      required: true
  - type: textarea
    id: problem-context
    attributes:
      label: Context & Mental Load Problem Statement
      description: What is the real problem or friction experienced by the user or duo? How does it increase mental load?
      placeholder: "Example: Recurring household tasks are often manually reassigned, causing friction and asymmetric load..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & User Experience (UX)
      description: Describe precisely the desired solution, user interactions, and expected outcome.
      placeholder: "Example: Introduce an automatic alternating rotation rule upon completion of each recurring task..."
    validations:
      required: true
  - type: textarea
    id: impact-analytics
    attributes:
      label: Desired Impact Metrics & Telemetry
      description: Which telemetry events (event_name, parameters) or usage metrics will measure adoption and success?
      placeholder: "Example:\n- event_name: 'recurring_task_created' (params: frequency, is_duo_rotating, area)\n- event_name: 'duo_rotation_assigned' (params: frequency, rotation_role, cycle_count)"
    validations:
      required: false
  - type: textarea
    id: technical-architecture
    attributes:
      label: Technical Architecture & Implementation Notes (Optional)
      description: Anticipated implementation details (Room Schema, StateFlow, ViewModel, Jetpack Compose, Gemini, Firestore).
      placeholder: "Example: Add 'rotationRule' field to MentalLoadItem, update SecondBrainRepository..."
    validations:
      required: false
  - type: checkboxes
    id: quality-commitments
    attributes:
      label: Quality Commitments & Guidelines
      description: Mandatory validation criteria for future implementation.
      options:
        - label: Adherence to MVI / Clean Kotlin architecture (ViewModel, StateFlow, Room / Firestore)
          required: true
        - label: 100% Jetpack Compose UI compliant with Serene UI principles (gentle animations, zero friction)
          required: true
        - label: Formalized Analytics & Observability contract
          required: true
        - label: Unit tests & Robolectric (100% passing on './scripts/quality-check.sh')
          required: true
