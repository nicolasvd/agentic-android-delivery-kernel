name: 🐛 Bug Report
description: Report a malfunction, regression, or synchronization issue
title: "fix(<scope>): <short descriptive bug title>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔍 Agentic Android Kernel Bug Report
        Please detail the unexpected behavior to facilitate diagnosis and resolution.
  - type: dropdown
    id: scope
    attributes:
      label: Scope / Affected Domain
      description: Choose the primary domain where the bug occurs.
      options:
        - tasks (Creation, editing, deletion, mental load completion)
        - matrix (Eisenhower matrix display or interaction)
        - duo (Real-time synchronization, duo pairing)
        - analytics (Gauge calculation, trends, charts)
        - auth (Google Sign-In, sessions)
        - sync (Firestore, Room, offline)
        - ui (Display, visual glitch, animation)
        - ai (Gemini classification, API timeout)
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clear and concise description of the issue encountered.
      placeholder: "Example: When switching to the Duo tab, the loading state remains stuck..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: What are the exact steps leading to the problem?
      placeholder: |
        1. Open the application
        2. Go to the 'Matrix' tab
        3. Drag a task to the 'Delegate' quadrant
        4. Observe the error...
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What should have happened, and what actually occurred?
      placeholder: "Expected: Task moves to target quadrant with smooth animation.\nActual: Crash or task remains unchanged."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Test Environment
      description: Device model, Android OS version, application version.
      placeholder: "Pixel 8 Pro - Android 14 / Emulator API 34 - v0.1.0"
    validations:
      required: false
  - type: textarea
    id: logs-and-stacktrace
    attributes:
      label: Logs / Stacktrace (Optional)
      description: Paste relevant Android Studio / Logcat logs here.
      placeholder: "Logcat / Stacktrace..."
    validations:
      required: false
