name: 🐛 Bug Report
description: Report a malfunction, regression, or synchronization issue
title: "fix(<scope>): <short descriptive bug title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔍 Agentic Android Kernel Bug Report
        Please detail the unexpected behavior to facilitate diagnosis and resolution.
  - type: dropdown
    id: scope
    attributes:
      label: Scope / Affected Domain
      description: Choose the primary domain where the bug occurs.
      options:
        - core (Local Room database, data repositories, clean architecture)
        - ui (Jetpack Compose components, themes, animations, Roborazzi)
        - ai (Gemini multimodal logic, smart agents, function calling)
        - sync (Firestore synchronization, offline-first reconciliation)
        - analytics (Zero-PII telemetry, adoption metrics, audit trails)
        - tooling (Operational scripts, CI/CD automation, hooks)
        - governance (Rules, personas, multi-agent protocol, templates)
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clear and concise description of the issue encountered.
      placeholder: "Example: When navigating back from the details screen, the state resets unexpectedly..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: What are the exact steps leading to the problem?
      placeholder: |
        1. Open the application
        2. Navigate to the target screen
        3. Trigger the action
        4. Observe the error...
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What should have happened, and what actually occurred?
      placeholder: "Expected: State is preserved smoothly with no animation glitch.\nActual: State resets or crash occurs."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Test Environment
      description: Device model, Android OS version, application version.
      placeholder: "Pixel 8 Pro - Android 14 / Emulator API 34 - v1.0.0"
    validations:
      required: false
  - type: textarea
    id: logs-and-stacktrace
    attributes:
      label: Logs / Stacktrace (Optional)
      description: Paste relevant Android Studio / Logcat logs here.
      placeholder: "Logcat / Stacktrace..."
    validations:
      required: false
