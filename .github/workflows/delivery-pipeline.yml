name: Delivery Pipeline & Quality Gate

on:
  pull_request:
    branches:
      - main
      - 'epic/**'
  push:
    branches:
      - main
  milestone:
    types: [ closed ]
  workflow_dispatch:
    inputs:
      tester_groups:
        description: "Firebase App Distribution tester groups (comma-separated)"
        required: false
        default: "testers, dev"
        type: string
      milestone_version:
        description: "Milestone version override (e.g. v1.0.0) — required for manual release"
        required: false
        type: string

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate & Sanity Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_release: ${{ steps.check_skip.outputs.skip_release }}
      is_release_run: ${{ steps.check_skip.outputs.is_release_run }}
      milestone_title: ${{ steps.resolve_milestone.outputs.milestone_title }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Milestone Context & Validate Dispatch Input
        id: resolve_milestone
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ inputs.milestone_version }}"
            if [ -n "$INPUT_VER" ] && ! echo "$INPUT_VER" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::milestone_version must match vX.Y.Z format. Given: '$INPUT_VER'"
              exit 1
            fi
          fi
          TITLE="${{ github.event.milestone.title || inputs.milestone_version || '' }}"
          echo "milestone_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Milestone context resolved: '$TITLE'"

      - name: Validate Design System & Agent Documentation Files
        run: |
          chmod +x ./scripts/validate-docs.sh
          ./scripts/validate-docs.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for skip-release PR label and release activation
        id: check_skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release_run=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Trigger '${{ github.event_name }}': Quality checks only (no release)."
          else
            echo "is_release_run=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Trigger '${{ github.event_name }}': Milestone release cycle activated."
          fi
          
          PR_SKIP=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null | grep -q "skip-release"; then
              PR_SKIP=true
            fi
          fi
          
          if [ "$PR_SKIP" = "true" ]; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ PR carries 'skip-release' label. Skipping release jobs."
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Code Changes
        id: check_code
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            # Compare les fichiers modifiés par rapport à la branche cible du PR
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            echo "Fichiers modifiés (vs origin/${BASE_REF}) :"
            echo "$CHANGED_FILES"
          
            if echo "$CHANGED_FILES" | grep -qE '^(app/|gradle/|build\.gradle\.kts|settings\.gradle\.kts|kernel\.config\.json)'; then
              echo "code_changed=true" >> "$GITHUB_OUTPUT"
              echo "📱 Modifications code/build détectées : Exécution complète de Gradle."
            else
              echo "code_changed=false" >> "$GITHUB_OUTPUT"
              echo "📄 PR purement documentaire/gouvernance : Compilation Android ignorée."
            fi
          else
            # Sur push main, milestone ou dispatch : on exécute toujours
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Full Code Inspection & Sanity Checks
        if: steps.check_code.outputs.code_changed == 'true'
        run: ./gradlew codeSanityCheck --stacktrace

      - name: Upload Test & Lint Reports
        if: failure() && steps.check_code.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-inspection-reports
          retention-days: 1
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.sarif
          if-no-files-found: ignore

  semver-release:
    # Tier 2 — Milestone Release Train: SemVer tag + GitHub Release (Milestone-gated, binaries + checksums only).
    # This job triggers exclusively when a Milestone is closed or via manual workflow_dispatch.
    # Internal documentation files (agent.md, DESIGN.md, rule files) are NEVER attached to GitHub Releases.
    name: Milestone Release & GitHub Tagging
    needs: quality-gate
    if: needs.quality-gate.outputs.is_release_run == 'true' && needs.quality-gate.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Milestone Tag & Aggregate Release Notes
        id: tag_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ inputs.milestone_version }}"
            if [ -z "$INPUT_VER" ] || ! echo "$INPUT_VER" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::workflow_dispatch release requires milestone_version matching vX.Y.Z format. Given: '$INPUT_VER'"
              exit 1
            fi
          fi

          MILESTONE_TITLE="${{ needs.quality-gate.outputs.milestone_title }}"
          TAG_NAME=$(echo "$MILESTONE_TITLE" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          
          if [ -z "$TAG_NAME" ]; then
            RAW_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | cut -d'"' -f2 || node -e 'try{console.log(require("./kernel.config.json").project.version)}catch{console.log("1.0.0")}')
            TAG_NAME="v${RAW_VERSION}"
          fi
          
          echo "new_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "🎯 Resolved release tag: $TAG_NAME"

          echo "## Release $TAG_NAME" > release-notes.txt
          if [ -n "$MILESTONE_TITLE" ]; then
            echo "" >> release-notes.txt
            echo "### Milestone: $MILESTONE_TITLE" >> release-notes.txt
            echo "" >> release-notes.txt
            echo "#### Delivered Features & Closed Issues:" >> release-notes.txt
            gh issue list --milestone "$MILESTONE_TITLE" --state closed --json number,title --template '{{range .}}- #{{.number}} {{.title}}{{"\n"}}{{end}}' >> release-notes.txt 2>/dev/null || true
          fi

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "✅ Created and pushed git tag $TAG_NAME"
          fi

      - name: Create GitHub Release (binaries & checksums only — zero internal docs)
        # GUARDRAIL: Only compiled APKs and checksums.sha256 are attached.
        # NEVER attach: agent.md, DESIGN.md, design-system.md, or any .agent/ rule/workflow file.
        uses: softprops/action-gh-release@v2
        if: steps.tag_version.outputs.new_tag != ''
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body_path: release-notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-distribute:
    name: Build, Release & Firebase Distribution
    needs: [ quality-gate, semver-release ]
    if: needs.quality-gate.outputs.is_release_run == 'true' && needs.quality-gate.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode and inject google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            node -e '
              const fs = require("fs");
              const gs = JSON.parse(fs.readFileSync("app/google-services.json", "utf8"));
              let debugPkg = "com.example.kernel.starter.debug";
              try {
                if (fs.existsSync("kernel.config.json")) {
                  const cfg = JSON.parse(fs.readFileSync("kernel.config.json", "utf8"));
                  if (cfg?.android?.applicationId) debugPkg = cfg.android.applicationId + ".debug";
                }
              } catch {}
              if (Array.isArray(gs.client) && !gs.client.some(c => c.client_info?.android_client_info?.package_name === debugPkg)) {
                const debugClient = JSON.parse(JSON.stringify(gs.client[0]));
                debugClient.client_info.android_client_info.package_name = debugPkg;
                gs.client.push(debugClient);
                fs.writeFileSync("app/google-services.json", JSON.stringify(gs, null, 2));
                console.log("Injected debug package client into google-services.json for assembleDebug.");
              }
            ' || true
          else
            echo "Warning: GOOGLE_SERVICES_JSON_B64 secret is missing!"
          fi

      - name: Inject debug.keystore (for SHA-1 match on Firebase Auth)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
            echo "debug.keystore successfully injected to ~/.android/debug.keystore."
          else
            echo "Warning: DEBUG_KEYSTORE_B64 secret is missing! Firebase Auth might fail due to SHA-1 mismatch."
          fi

      - name: Build All APK Variants (Debug & Release)
        run: ./gradlew assemble --stacktrace

      - name: Attach Built APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: needs.semver-release.outputs.new_tag != ''
        continue-on-error: true
        with:
          tag_name: ${{ needs.semver-release.outputs.new_tag }}
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Firebase Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_B64" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > service-account.json
            echo "Firebase service-account.json decoded and loaded successfully."
          else
            echo "Warning: No FIREBASE_SERVICE_ACCOUNT_B64 secret found."
          fi

      - name: Prepare Release Notes
        run: |
          TAG_NAME="${{ needs.semver-release.outputs.new_tag }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git describe --tags --always 2>/dev/null || echo "latest")
          fi
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format:"%s (%an)" 2>/dev/null || echo "Automated CI/CD build")
          fi
          echo "Release ${TAG_NAME} - Commit: ${COMMIT_MSG}" > release-notes.txt
          echo "Generated release notes:"
          cat release-notes.txt

      - name: Upload to Firebase App Distribution
        continue-on-error: true
        env:
          FIREBASE_TESTER_GROUPS: ${{ inputs.tester_groups || 'testers, dev' }}
          GOOGLE_APPLICATION_CREDENTIALS: "${{ github.workspace }}/service-account.json"
        run: |
          if [ ! -f "service-account.json" ] || [ ! -s "service-account.json" ]; then
            echo "⚠️ No service-account.json found. Skipping Firebase App Distribution upload."
          else
            echo "🚀 Uploading Release build to Firebase App Distribution..."
            ./gradlew appDistributionUploadRelease --stacktrace || echo "⚠️ Firebase App Distribution upload encountered a non-fatal warning."
          fi

      - name: Bump versionCode on main for next milestone cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git checkout main
          
          CURRENT_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' || echo "")
          if [ -n "$CURRENT_CODE" ]; then
            NEW_CODE=$((CURRENT_CODE + 100))
            echo "Bumping versionCode from $CURRENT_CODE to $NEW_CODE..."
            sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$NEW_CODE/" app/build.gradle.kts
          
            git add app/build.gradle.kts
            git commit -m "chore(release): bump versionCode to $NEW_CODE for next milestone cycle [skip ci]"
            git push origin main
            echo "✅ Successfully bumped versionCode to $NEW_CODE on main."
          else
            echo "⚠️ Could not parse current versionCode from app/build.gradle.kts."
          fi

      - name: Clean up temporary credentials and release notes
        if: always()
        run: rm -f service-account.json release-notes.txt app/google-services.json ~/.android/debug.keystore
